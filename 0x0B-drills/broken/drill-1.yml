# BROKEN ON PURPOSE — drill 1.
# Symptom: every run installs the dependencies from scratch. The cache step
# reports success each time, and the "Post" step happily saves a new entry.
name: drill-1
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ github.sha }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: How long did that take?
        run: echo "look at the duration of the Install step across runs"
