# BROKEN ON PURPOSE — drill 5.
# Symptom: when two commits land close together, the deploy sometimes ends
# with the OLDER commit live. The logs of both runs look perfect.
name: drill-5
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pretend to build
        run: |
          echo "building ${GITHUB_SHA:0:7}"
          sleep 20

      - name: Pretend to deploy
        run: |
          echo "deploying ${GITHUB_SHA:0:7} to the shared environment"
          sleep 20
          echo "${GITHUB_SHA:0:7}" > live.txt

      - name: What is live now?
        run: cat live.txt
